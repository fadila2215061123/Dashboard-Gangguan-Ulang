<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}" />
</head>

<body>
    <div class="container-fluid d-flex justify-content-center align-items-center min-vh-100">
        <div class="card card-login shadow">

            <!-- KIRI: Form Login -->
            <div class="login-left">
                <h4 class="mb-4 text-center">LOGIN</h4>
                <form method="POST" action="/login">

                    {% with messages = get_flashed_messages(category_filter=['error']) %}
                    {% if messages %}
                    <p class="error-message text-center">
                        {{ messages[0] }}
                    </p>
                    {% endif %}
                    {% endwith %}

                    <!-- Input Email -->
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"> <i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" name="email" placeholder="Email" required
                                id="emailInput" />
                        </div>
                    </div>

                    <!-- Input Password -->
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" name="password" placeholder="Password" required
                                id="passwordInput" />
                            <span class="input-group-text" id="togglePassword" style="cursor: pointer;">
                                <i class="bi bi-eye-slash" id="eyeIcon"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Tombol Login -->
                    <button type="submit" class="btn btn-danger" id="loginButton">
                        Login
                    </button>
                </form>
            </div>

            <!-- PEMBATAS -->
            <div class="separator"></div>

            <!-- KANAN: Logo -->
            <div class="login-right">
                <img src="{{ url_for('static', filename='images/logo_telkom.png') }}" alt="Logo Telkom"
                    class="logo-img" />
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const emailInput = document.getElementById('emailInput');
            const passwordInput = document.getElementById('passwordInput');
            const loginButton = document.getElementById('loginButton');
            const togglePassword = document.getElementById('togglePassword');
            const eyeIcon = document.getElementById('eyeIcon');

            // Disable button if inputs are empty
            function checkInputs() {
                loginButton.disabled = !(emailInput.value.trim() && passwordInput.value.trim());
            }

            emailInput.addEventListener('input', checkInputs);
            passwordInput.addEventListener('input', checkInputs);

            // Toggle password visibility
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);

                // Ganti ikon
                eyeIcon.classList.toggle('bi-eye');
                eyeIcon.classList.toggle('bi-eye-slash');
            });
        });
    </script>
</body>

</html>
